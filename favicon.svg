<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#4fc3f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- bg circle -->
  <circle cx="32" cy="32" r="30" fill="#12121a" stroke="url(#g)" stroke-width="2"/>
  <!-- CK monogram -->
  <text x="32" y="43" font-family="'JetBrains Mono','Courier New',monospace" font-weight="700" font-size="28" text-anchor="middle" fill="url(#g)" filter="url(#glow)">CK</text>
  <!-- accent dot -->
  <circle cx="50" cy="16" r="5" fill="#4fc3f7">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;6.5;5" dur="2.2s" repeatCount="indefinite"/>
  </circle>
</svg>